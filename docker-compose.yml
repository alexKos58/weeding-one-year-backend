version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: invitation-db
    restart: always

    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: .
    container_name: invitation-backend
    restart: always

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wedding
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    ports:
      - "8080:8080"

    depends_on:
      - postgres


volumes:
  postgres_data: